<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogManager · Painel</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topo">
        <a href="/dashboard" class="marca">
            <img src="/static/img/logo.png" alt="DogManager">
        </a>
        <a href="/logout" class="link-sair">Sair</a>
    </header>
    <main class="conteudo">
        <h1>Painel</h1>
        <div class="grade-cards">
            <a href="/clientes" class="card-modulo">
                <span class="card-icone">👤</span>
                <span class="card-titulo">Clientes</span>
                <span class="card-descricao">Cadastro e dados dos donos</span>
            </a>
            <a href="/cachorros" class="card-modulo">
                <span class="card-icone">🐶</span>
                <span class="card-titulo">Cachorros</span>
                <span class="card-descricao">Cães e fichas de avaliação</span>
            </a>
            <a href="/planos" class="card-modulo">
                <span class="card-icone">📦</span>
                <span class="card-titulo">Planos</span>
                <span class="card-descricao">Pacotes de sessões</span>
            </a>
            <a href="/agenda" class="card-modulo">
                <span class="card-icone">📅</span>
                <span class="card-titulo">Agenda</span>
                <span class="card-descricao">Aulas e diário de bordo</span>
            </a>
            <a href="/trocar-senha" class="card-modulo">
                <span class="card-icone">🔑</span>
                <span class="card-titulo">Trocar Senha</span>
                <span class="card-descricao">Alterar sua senha de acesso</span>
             </a>
        </div>
    </main>
</body>
</html>
