<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Sistema do Adestrador</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="pagina-centralizada">
    <main class="cartao-login">
        <p class="marca">🐾 Sistema do Adestrador</p>

        {% if erro %}
        <p class="aviso-erro">{{ erro }}</p>
        {% endif %}

        <form method="post" action="/login">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" autofocus required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
