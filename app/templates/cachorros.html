<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachorros · Sistema do Adestrador</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topo">
        <a href="/dashboard" class="marca">🐾 Sistema do Adestrador</a>
        <a href="/logout" class="link-sair">Sair</a>
    </header>
    <main class="conteudo">
        <p class="trilha"><a href="/dashboard">Painel</a> / Cachorros</p>
        <h1>Cachorros</h1>

        <section class="painel-formulario">
            <h2 id="titulo-formulario">Novo cachorro</h2>
            <form id="form-cachorro">
                <input type="hidden" id="cachorro-id">

                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <label for="raca">Raça</label>
                <input type="text" id="raca">

                <label for="idade">Idade (anos)</label>
                <input type="number" id="idade" min="0" step="1">

                <label for="sexo">Sexo</label>
                <select id="sexo">
                    <option value="">Selecione</option>
                    <option value="Macho">Macho</option>
                    <option value="Fêmea">Fêmea</option>
                </select>

                <label for="cliente_id">Cliente responsável</label>
                <select id="cliente_id" required>
                    <option value="">Carregando clientes...</option>
                </select>

                <div class="acoes-formulario">
                    <button type="submit" id="botao-salvar">Salvar</button>
                    <button type="button" id="botao-cancelar" class="botao-secundario" hidden>Cancelar edição</button>
                </div>
            </form>
        </section>

        <section class="painel-lista">
            <table class="tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Raça</th>
                        <th>Idade</th>
                        <th>Sexo</th>
                        <th>Cliente</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>
            <p id="mensagem-lista-vazia" hidden>Nenhum cachorro cadastrado ainda.</p>
        </section>
    </main>

    <script src="/static/js/cachorros.js"></script>
</body>
</html>
